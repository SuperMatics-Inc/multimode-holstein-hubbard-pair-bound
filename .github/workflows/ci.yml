name: replay-and-paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source manifest and replay pin
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('replay')
          pins = json.loads((root / 'SOURCE-PINS.json').read_text())
          if pins.get('algorithm') != 'sha256' or len(pins.get('files', [])) != 3:
              raise SystemExit('Unexpected EXTHOL source pin manifest')
          for entry in pins['files']:
              source = root / entry['path']
              if hashlib.sha256(source.read_bytes()).hexdigest() != entry['sha256']:
                  raise SystemExit(f'Source pin mismatch: {source}')
          PY
      - name: Install pinned replay dependencies
        run: python -m pip install --disable-pip-version-check mpmath==1.4.1 numpy==2.5.5
      - name: Default finite replay
        run: python -B replay/replay.py
      - name: All guarded mutants
        run: |
          set -euo pipefail
          python -B replay/replay.py --all-mutants | tee replay.out
          grep -qF 'CERTIFIED: all 20 mutants rejected with exit 1' replay.out
      - name: Public prose safeguards
        run: |
          set -euo pipefail
          if grep -nE '—|–|---|\b(LINEAR[[:alnum:]_-]*|STAGE[[:alnum:]_-]*|HUBHOL|EXTHOL)\b|\b(PROVED|CERTIFIED|NUMERICAL|INFERENCE)\b|reserved DOI' paper/main.tex paper/refs.bib README.md; then exit 1; fi
          grep -qF 'This preprint has not been peer reviewed.' paper/main.tex
          grep -qF 'This preprint has not been peer reviewed.' README.md
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic and poppler
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          tectonic --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build the manuscript
        working-directory: paper
        run: |
          set -euo pipefail
          tectonic --keep-logs main.tex
          if grep -nE 'Overfull|Underfull|Undefined|Warning|Citation.*undefined|There were' main.log; then exit 1; fi
          test -s main.pdf
          pdfinfo -url main.pdf > urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24384461' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24384463' urls.txt
          pdftotext main.pdf main.txt
          if grep -nE '—|–|---|\b(LINEAR[[:alnum:]_-]*|STAGE[[:alnum:]_-]*|HUBHOL|EXTHOL)\b|\b(PROVED|CERTIFIED|NUMERICAL|INFERENCE)\b' main.txt; then exit 1; fi
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'This preprint has not been peer reviewed.'
      - uses: actions/upload-artifact@v4
        with:
          name: multi-mode-holstein-hubbard-pair-bound-paper
          path: |
            paper/main.pdf
            paper/main.log
            paper/main.tex
            paper/refs.bib
            paper/urls.txt
          if-no-files-found: error
